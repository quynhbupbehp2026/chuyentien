<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHUYỂN TIỀN CHO QUỴNH BÚP BÊ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gemini: {
                            50: '#f0f4ff',
                            100: '#e0eaff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(51, 65, 85, 0.6);
        }
        /* Mẫu thẻ VietQR chuẩn thiết kế */
        .qr-template-card {
            background-color: #ffffff;
            border: 2px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        /* Style để ẩn thanh cuộn dưới các nút chọn nhanh số tiền */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col pt-8">

    <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full">
        <!-- Hero Title -->
        <div class="text-center mb-8">
            <h2 class="text-2xl sm:text-3xl font-extrabold mb-2 text-white uppercase tracking-tight">
                CHUYỂN TIỀN CHO QUỴNH BÚP BÊ
            </h2>
        </div>

        <!-- Layout 3 cột -->
        <div id="chatGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Rendered by Javascript -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-12">
            <div class="w-16 h-16 bg-slate-800 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-3">
                <i class="fa-solid fa-inbox text-2xl"></i>
            </div>
            <p class="text-slate-400 font-medium">Không tìm thấy tài khoản phù hợp.</p>
        </div>
    </main>

    <!-- Custom Exact Match QR Code Popup Modal -->
    <div id="qrModal" class="fixed inset-0 bg-black/75 backdrop-blur-md z-50 hidden flex items-center justify-center p-4 transition-all duration-300">
        <div class="relative w-full max-w-[360px]">
            <button onclick="toggleModal('qrModal')" class="absolute -top-10 right-0 text-white/80 hover:text-white transition text-2xl">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <!-- Mẫu ảnh QR chuẩn giao diện -->
            <div id="qrCardPrint" class="qr-template-card rounded-2xl p-6 text-center text-slate-800 flex flex-col items-center">
                
                <!-- Tên chủ tài khoản -->
                <h3 id="cardAccName" class="text-2xl font-black text-[#dc2626] uppercase tracking-wide mb-4">
                    CHU THỊ TÍNH
                </h3>

                <!-- Mã QR VietQR -->
                <div class="w-full flex justify-center mb-4">
                    <img id="cardQrImg" src="" crossorigin="anonymous" alt="Mã QR" class="w-64 h-64 object-contain">
                </div>

                <!-- Ngân hàng & STK -->
                <div class="text-slate-700 font-bold text-sm mb-2 flex items-center justify-center gap-1.5">
                    <span id="cardBankName">VietinBank</span>
                    <span id="stkDot">•</span>
                    <span id="stkBox">STK: <span id="cardStk">105885080166</span></span>
                </div>

                <!-- Số tiền -->
                <div id="cardAmount" class="text-2xl font-extrabold text-[#2563eb] mb-1">
                    Số tiền: Tùy chọn
                </div>

                <!-- Nội dung chuyển khoản -->
                <div class="text-slate-600 text-xs font-semibold mb-5">
                    Nội dung: <span id="cardAddInfo">TINH TINH</span>
                </div>

                <!-- Dòng ghi chú màu đỏ -->
                <div class="text-[#dc2626] font-black text-lg tracking-tight uppercase">
                    CK XONG - CHỤP BƯU GỬI
                </div>
            </div>

            <!-- Các nút thao tác dưới Popup -->
            <div class="mt-4 flex gap-2">
                <button id="copyBtn" onclick="copyCardToClipboard()" class="flex-1 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold transition flex items-center justify-center gap-2 shadow-md">
                    <i class="fa-solid fa-copy"></i>
                    <span id="copyBtnText">Sao chép ảnh</span>
                </button>
                <button onclick="toggleModal('qrModal')" class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold transition">
                    Đóng
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="py-6 border-t border-slate-800/80 text-center text-xs text-slate-400">
        <p>Tác phẩm đầu tay của QUYNH BUP BE</p>
    </footer>

    <script>
        const chatData = [
            {
                id: 1,
                accId: 'acc1',
                accName: 'CHU THỊ TÍNH',
                title: 'VietinBank',
                bankCode: 'ICB',
                stk: '105885080166',
                addInfo: 'TINH TINH',
                desc: 'Bấm Tạo QR để nhập số tiền chuyển khoản.',
                url: 'https://share.gemini.google/IfImWU4yoepd',
                badgeBg: 'bg-emerald-950/60 text-emerald-400 border-emerald-500/80'
            },
            {
                id: 2,
                accId: 'acc2',
                accName: 'ĐẶNG THỊ TRÀ',
                title: 'Vietcombank',
                bankCode: 'VCB',
                stk: '9972202863',
                addInfo: 'Chuyen tien',
                url: '',
                badgeBg: 'bg-teal-950/60 text-teal-400 border-teal-500/80'
            },
            {
                id: 3,
                accId: 'acc3',
                accName: 'ĐẶNG THỊ THỤY',
                title: 'MBV',
                bankCode: 'MB',
                stk: '239796868',
                addInfo: 'CHUYEN TIEN NHANH 24/7',
                url: '',
                badgeBg: 'bg-indigo-950/60 text-indigo-400 border-indigo-500/80'
            },
            {
                id: 4,
                accId: 'acc4',
                accName: 'QUỴNH BÚP BÊ',
                title: 'VIETCOMBANK',
                bankCode: 'VCB',
                stk: '0341006964128',
                addInfo: 'CHUYEN TIEN NHANH 24/7',
                url: 'https://share.gemini.google/UtIf1VTqOt8Y',
                badgeBg: 'bg-amber-950/60 text-amber-400 border-amber-500/80'
            },
            {
                id: 5,
                accId: 'acc5',
                accName: 'CAO THỊ HUYỀN',
                title: 'VIETCOMBANK',
                bankCode: 'VCB',
                stk: '9967402995',
                addInfo: 'CHUYEN TIEN NHANH 24/7',
                desc: 'Bấm Tạo QR để nhập số tiền chuyển khoản',
                url: 'https://share.gemini.google/8PaIUsZ1iFKx',
                badgeBg: 'bg-emerald-950/60 text-emerald-400 border-emerald-500/80'
            },
            {
                id: 6,
                accId: 'acc6',
                accName: 'ĐẶNG THỊ BÀNG',
                title: 'VietinBank',
                bankCode: 'ICB',
                stk: '109886083650',
                addInfo: 'DANG THI BANG',
                url: '',
                badgeBg: 'bg-rose-950/60 text-rose-400 border-rose-500/80'
            },
            {
                id: 7,
                 accId: 'acc7',
                accName: 'ĐẶNG VĂN QUỲNH',
                title: 'BIDV',
                bankCode: 'BIDV',
                stk: '1208134642',
                addInfo: 'CHUYEN TIEN NHANH 24/7',
                desc: 'Bấm Tạo QR để nhập số tiền chuyển khoản',
                url: 'https://share.gemini.google/jG1dXq8kJwxP',
                badgeBg: 'bg-purple-950/60 text-purple-400 border-purple-500/80'
            },
            {
                id: 8,
                accId: 'acc8',
                accName: 'HKD CAO THỊ HUYỀN',
                title: 'BIDV',
                bankCode: 'BIDV',
                stk: '9649PAYK7ORQV046N1K',
                addInfo: 'CHUYEN TIEN NHANH 24/7',
                url: '',
                badgeBg: 'bg-cyan-950/60 text-cyan-400 border-cyan-500/80'
            },
            {
                id: 9,
                accId: 'acc9',
                accName: 'NGUYỄN THU HƯƠNG',
                title: 'MBV',
                bankCode: 'MB',
                stk: '9125932162239',
                addInfo: 'CHUYEN TIEN NHANH 24/7',
                url: '',
                badgeBg: 'bg-pink-950/60 text-pink-400 border-pink-500/80'
            }
        ];

        // Format Currency Input
        function formatCurrencyInput(input) {
            let value = input.value.replace(/\D/g, '');
            if (value) {
                input.value = Number(value).toLocaleString('vi-VN');
            } else {
                input.value = '';
            }
        }

        // Set Quick Amount
        function setQuickAmount(id, amount) {
            const input = document.getElementById(`amount-${id}`);
            if (input) {
                input.value = Number(amount).toLocaleString('vi-VN');
            }
        }

        // Clear Amount Input
        function clearAmount(id) {
            const input = document.getElementById(`amount-${id}`);
            if (input) {
                input.value = '';
            }
        }

        // Parse Smart Amount
        function getSmartAmount(rawValue) {
            if (!rawValue || rawValue.trim() === '') return 0;
            let num = Number(rawValue.replace(/\D/g, ''));
            if (!num || num <= 0) return 0;
            if (num < 1000) {
                num = num * 1000;
            }
            return num;
        }

        // Create QR Card Exact Match
        function createQR(id) {
            const item = chatData.find(c => c.id === id);
            if (!item) return;

            const amountInput = document.getElementById(`amount-${id}`);
            const rawVal = amountInput ? amountInput.value : '';
            const amount = getSmartAmount(rawVal);

            if (amount > 0 && amountInput) {
                amountInput.value = amount.toLocaleString('vi-VN');
            }

            let qrUrl = '';
            if (item.stk) {
                const amountParam = amount > 0 ? `amount=${amount}&` : '';
                qrUrl = `https://img.vietqr.io/image/${item.bankCode}-${item.stk}-qr_only.png?${amountParam}addInfo=${encodeURIComponent(item.addInfo)}&accountName=${encodeURIComponent(item.accName)}`;
                
                document.getElementById('stkBox').style.display = 'inline';
                document.getElementById('stkDot').style.display = 'inline';
                document.getElementById('cardStk').innerText = item.stk;
            } else {
                let targetUrl = item.url;
                if (amount > 0) {
                    targetUrl += `?amount=${amount}`;
                }
                qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(targetUrl)}`;
                document.getElementById('stkBox').style.display = 'none';
                document.getElementById('stkDot').style.display = 'none';
            }

            document.getElementById('cardAccName').innerText = item.accName;
            document.getElementById('cardBankName').innerText = item.title;
            
            if (amount > 0) {
                document.getElementById('cardAmount').innerText = `${amount.toLocaleString('vi-VN')} VNĐ`;
            } else {
                document.getElementById('cardAmount').innerText = 'Số tiền: Tùy chọn';
            }

            document.getElementById('cardAddInfo').innerText = item.addInfo;
            document.getElementById('cardQrImg').src = qrUrl;

            toggleModal('qrModal');
        }

        // Chức năng sao chép toàn bộ thẻ QR vào Clipboard dưới dạng Image
        async function copyCardToClipboard() {
            const btnText = document.getElementById('copyBtnText');
            const cardElement = document.getElementById('qrCardPrint');
            const originalText = btnText.innerText;

            try {
                btnText.innerText = 'Đang xử lý...';
                
                const canvas = await html2canvas(cardElement, {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: '#ffffff'
                });

                canvas.toBlob(async (blob) => {
                    if (!blob) {
                        alert('Không thể tạo ảnh, vui lòng thử lại!');
                        btnText.innerText = originalText;
                        return;
                    }

                    try {
                        const item = new ClipboardItem({ 'image/png': blob });
                        await navigator.clipboard.write([item]);
                        btnText.innerText = 'Đã sao chép!';
                        setTimeout(() => {
                            btnText.innerText = originalText;
                        }, 2000);
                    } catch (err) {
                        console.error(err);
                        alert('Trình duyệt không hỗ trợ chép ảnh trực tiếp. Vui lòng thử trên Chrome/Edge/Safari mới nhất.');
                        btnText.innerText = originalText;
                    }
                }, 'image/png');

            } catch (error) {
                console.error(error);
                alert('Có lỗi khi tạo ảnh QR.');
                btnText.innerText = originalText;
            }
        }

        // Render Cards List khớp giao diện mẫu
        function renderCards(chats) {
            const grid = document.getElementById('chatGrid');
            const emptyState = document.getElementById('emptyState');

            if (chats.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            grid.innerHTML = chats.map(chat => `
                <div class="glass-card rounded-2xl p-4 sm:p-5 transition-all duration-300 shadow-sm flex flex-col justify-between">
                    <div>
                        <!-- Hàng 1: Badge Tên bên trái + Nút Tạo QR bên phải nằm ngang hàng -->
                        <div class="flex items-center justify-between gap-2 mb-3">
                            <span class="inline-flex items-center gap-2 text-xs sm:text-sm font-black tracking-wide px-3 py-1.5 rounded-full border ${chat.badgeBg} truncate max-w-[65%]">
                                <i class="fa-solid fa-user-circle text-base shrink-0"></i>
                                <span class="truncate">${chat.accName}</span>
                            </span>

                            <button onclick="createQR(${chat.id})" class="px-3.5 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold transition flex items-center gap-1.5 shrink-0 shadow-md">
                                <i class="fa-solid fa-qrcode text-xs"></i>
                                <span>Tạo QR</span>
                            </button>
                        </div>

                        <!-- Hàng 2: STK chuẩn giao diện -->
                        <div class="text-xs sm:text-sm text-slate-300 font-mono font-bold tracking-wider mb-4 pl-0.5">
                            STK: <span class="text-slate-100 font-extrabold">${chat.stk ? chat.stk : (chat.url ? chat.url.split('/').pop() : '')}</span>
                        </div>

                        <!-- Input Amount Section -->
                        <div class="mb-2">
                            <label class="block text-[11px] font-bold text-slate-400 tracking-wider uppercase mb-1.5">
                                NHẬP SỐ TIỀN (VNĐ)
                            </label>
                            <div class="relative">
                                <input type="text" id="amount-${chat.id}" oninput="formatCurrencyInput(this)" placeholder="Mặc định: Tùy chọn số tiền..." class="w-full bg-slate-900/90 border border-slate-700/80 text-slate-100 rounded-xl pl-3.5 pr-8 py-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 font-medium placeholder-slate-400">
                                <span class="absolute right-3.5 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400">đ</span>
                            </div>
                            
                            <!-- Quick Choice Buttons (Đã ẩn thanh cuộn) -->
                            <div class="flex gap-1.5 mt-3 overflow-x-auto no-scrollbar items-center">
                                <button onclick="setQuickAmount(${chat.id}, 50000)" class="px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-[11px] font-bold text-slate-300 border border-slate-700/60 whitespace-nowrap transition">50k</button>
                                <button onclick="setQuickAmount(${chat.id}, 100000)" class="px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-[11px] font-bold text-slate-300 border border-slate-700/60 whitespace-nowrap transition">100k</button>
                                <button onclick="setQuickAmount(${chat.id}, 150000)" class="px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-[11px] font-bold text-slate-300 border border-slate-700/60 whitespace-nowrap transition">150k</button>
                                <button onclick="setQuickAmount(${chat.id}, 200000)" class="px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-[11px] font-bold text-slate-300 border border-slate-700/60 whitespace-nowrap transition">200k</button>
                                <button onclick="setQuickAmount(${chat.id}, 500000)" class="px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-[11px] font-bold text-slate-300 border border-slate-700/60 whitespace-nowrap transition">500k</button>
                                <button onclick="clearAmount(${chat.id})" class="px-2.5 py-1 rounded-lg bg-rose-950/40 hover:bg-rose-900/60 text-[11px] font-bold text-rose-400 border border-rose-800/70 whitespace-nowrap transition flex items-center gap-1">
                                    <i class="fa-solid fa-trash-can text-[10px]"></i> Xóa
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function toggleModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.toggle('hidden');
        }

        // Run on load
        window.onload = function() {
            renderCards(chatData);
        };
    </script>
</body>
</html>
