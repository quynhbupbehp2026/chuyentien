<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHUYỂN TIỀN CHO QUỴNH BÚP BÊ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gemini: {
                            50: '#f0f4ff', 100: '#e0eaff', 500: '#3b82f6',
                            600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(51, 65, 85, 0.6);
        }
        .qr-template-card {
            background-color: #0f172a;
            border: 2px solid #334155;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        #qrcodeCanvas img, #qrcodeCanvas canvas {
            width: 240px !important;
            height: 240px !important;
            object-fit: contain;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full">
        <div class="text-center mb-8">
            <h2 class="text-2xl sm:text-3xl font-extrabold mb-2 text-white uppercase tracking-tight">
                CHUYỂN TIỀN CHO QUỲNH BÚP BÊ
            </h2>
        </div>

        <div id="chatGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 items-start"></div>

        <div id="emptyState" class="hidden text-center py-12">
            <div class="w-16 h-16 bg-slate-800 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-3">
                <i class="fa-solid fa-inbox text-2xl"></i>
            </div>
            <p class="text-slate-400 font-medium">Không tìm thấy tài khoản phù hợp.</p>
        </div>
    </main>

    <!-- Modal hiển thị QR -->
    <div id="qrModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4 transition-all duration-300">
        <div class="relative w-full max-w-[360px]">
            <button onclick="toggleModal('qrModal')" class="absolute -top-10 right-0 text-white/80 hover:text-white transition text-2xl">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <!-- Khung thẻ -->
            <div id="qrCardPrint" class="qr-template-card rounded-2xl p-6 text-center text-white flex flex-col items-center">
                <h3 id="cardAccName" class="text-2xl font-black text-red-500 uppercase tracking-wide mb-4">
                    CHU THỊ TÍNH
                </h3>

                <div class="w-full flex justify-center mb-4 bg-white p-4 rounded-xl min-h-[256px] items-center relative">
                    <div id="qrcodeCanvas"></div>
                </div>

                <div class="text-slate-200 font-bold text-sm mb-2 flex items-center justify-center gap-1.5">
                    <span id="cardBankName">VietinBank</span>
                    <span id="stkDot">•</span>
                    <span id="stkBox">STK: <span id="cardStk">105885080166</span></span>
                </div>

                <div id="cardAmount" class="text-2xl font-extrabold text-blue-400 mb-4">
                    Số tiền: Tùy chọn
                </div>

                <div class="text-yellow-400 font-black text-lg tracking-tight uppercase">
                    CK XONG - CHỤP BƯU GỬI
                </div>
            </div>

            <!-- Nút bấm thao tác -->
            <div class="mt-4 flex gap-2">
                <button id="copyBtn" onclick="handleTransferAction()" class="flex-1 py-3 rounded-xl bg-amber-500 hover:bg-amber-600 text-black font-extrabold text-xs transition flex items-center justify-center gap-2 shadow-lg">
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                    <span id="copyBtnText">CHUYỂN TIỀN</span>
                </button>
                <button onclick="toggleModal('qrModal')" class="py-3 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold transition">
                    Đóng
                </button>
            </div>
        </div>
    </div>

    <footer class="py-6 border-t border-slate-800/80 text-center text-xs text-slate-400">
        <p>Tác phẩm đầu tay của QUYNH BUP BE</p>
    </footer>

    <script>
        const chatData = [
            { id: 1, accId: 'acc1', accName: 'CHU THỊ TÍNH', title: 'VIETINBANK', bankCode: 'ICB', stk: '105885080166', addInfo: 'TINH TINH', url: '' },
            { id: 2, accId: 'acc2', accName: 'ĐẶNG THỊ TRÀ', title: 'VIETCOMBANK', bankCode: 'VCB', stk: '9972202863', addInfo: 'CHUYEN TIEN NHANH 24/7', url: '' },
            { id: 3, accId: 'acc3', accName: 'ĐẶNG THỊ THỤY', title: 'MBV', bankCode: 'MBV', stk: '239796868', addInfo: 'CHUYEN TIEN NHANH 24/7', url: '' },
            { id: 4, accId: 'acc4', accName: 'ĐẶNG VĂN QUỲNH', title: 'BIDV', bankCode: 'BIDV', stk: '1208134642', addInfo: 'CHUYEN TIEN NHANH 24/7', url: '' },
            { id: 5, accId: 'acc5', accName: 'NGUYỄN THU HƯƠNG', title: 'MBV', bankCode: 'MBV', stk: '9125932162239', addInfo: 'CHUYEN TIEN NHANH 24/7', url: '' },
            { id: 6, accId: 'acc6', accName: 'ĐẶNG THỊ BÀNG', title: 'VIETINBANK', bankCode: 'ICB', stk: '109886083650', addInfo: 'CHUYEN TIEN NHANH 24/7', url: '' },
            { id: 7, accId: 'acc7', accName: 'QUỴNH BÚP BÊ', title: 'VIETCOMBANK', bankCode: 'VCB', stk: '0341006964128', addInfo: 'CHUYEN TIEN NHANH 24/7', url: '' },
            { id: 8, accId: 'acc8', accName: 'CAO THỊ HUYỀN', title: 'VIETCOMBANK', bankCode: 'VCB', stk: '9967402995', addInfo: 'CHUYEN TIEN NHANH 24/7', url: '' },
            { id: 9, accId: 'acc9', accName: 'HKD CAO THỊ HUYỀN', title: 'BIDV', bankCode: 'BIDV', stk: '9649PAYK7ORQV046N1K', addInfo: 'CHUYEN TIEN NHANH 24/7', url: '' }
        ];

        function formatCurrencyInput(input) {
            let value = input.value.replace(/\D/g, '');
            input.value = value ? Number(value).toLocaleString('vi-VN') : '';
        }

        function setQuickAmount(id, amount) {
            const input = document.getElementById(`amount-${id}`);
            if (input) input.value = Number(amount).toLocaleString('vi-VN');
        }

        function getSmartAmount(rawValue) {
            if (!rawValue || rawValue.trim() === '') return 0;
            let num = Number(rawValue.replace(/\D/g, ''));
            if (!num || num <= 0) return 0;
            if (num < 100000) num = num * 1000;
            return num;
        }

        function createQR(id) {
            const item = chatData.find(c => c.id === id);
            if (!item) return;

            const amountInput = document.getElementById(`amount-${id}`);
            const rawVal = amountInput ? amountInput.value : '';
            const amount = getSmartAmount(rawVal);

            if (amount > 0 && amountInput) {
                amountInput.value = amount.toLocaleString('vi-VN');
            }

            let qrString = '';
            if (item.stk) {
                const amountParam = amount > 0 ? `&a=${amount}` : '';
                qrString = `https://img.vietqr.io/image/${item.bankCode}-${item.stk}-qr_only.png?amount=${amount}&addInfo=${encodeURIComponent(item.addInfo)}&accountName=${encodeURIComponent(item.accName)}`;
                
                document.getElementById('stkBox').style.display = 'inline';
                document.getElementById('stkDot').style.display = 'inline';
                document.getElementById('cardStk').innerText = item.stk;
            } else {
                qrString = item.url + (amount > 0 ? `?amount=${amount}` : '');
                document.getElementById('stkBox').style.display = 'none';
                document.getElementById('stkDot').style.display = 'none';
            }

            document.getElementById('cardAccName').innerText = item.accName;
            document.getElementById('cardBankName').innerText = item.title;
            document.getElementById('cardAmount').innerText = amount > 0 ? `Số tiền: ${amount.toLocaleString('vi-VN')} VNĐ` : 'Số tiền: Tùy chọn';

            const container = document.getElementById('qrcodeCanvas');
            container.innerHTML = '';
            
            new QRCode(container, {
                text: qrString,
                width: 240,
                height: 240,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });

            toggleModal('qrModal');
        }

        async function handleTransferAction() {
            const btnText = document.getElementById('copyBtnText');
            const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);

            // Trên Mobile: Không dùng lệnh tải file gây hiện hộp thoại hỏi, chuyển sang hướng dẫn nhấn giữ trực tiếp vào thẻ QR rất gọn
            if (isMobile) {
                btnText.innerText = '👉 Nhấn giữ vào thẻ QR để sao chép!';
                setTimeout(() => { btnText.innerText = 'CHUYỂN TIỀN'; }, 3500);
                return;
            }

            // Trên Máy tính (PC): Giữ nguyên tính năng sao chép ảnh thẻ trực tiếp vào Clipboard rất ổn định
            btnText.innerText = 'Đang xử lý...';
            try {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 600;
                canvas.height = 780;

                ctx.fillStyle = '#0f172a';
                if (ctx.roundRect) {
                    ctx.beginPath();
                    ctx.roundRect(0, 0, 600, 780, 24);
                    ctx.fill();
                } else {
                    ctx.fillRect(0, 0, 600, 780);
                }

                ctx.fillStyle = '#ef4444';
                ctx.font = '900 32px "Inter", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(document.getElementById('cardAccName').innerText, 300, 70);

                ctx.fillStyle = '#ffffff';
                if (ctx.roundRect) {
                    ctx.beginPath();
                    ctx.roundRect(80, 100, 440, 440, 16);
                    ctx.fill();
                } else {
                    ctx.fillRect(80, 100, 440, 440);
                }

                const qrImgElement = document.querySelector('#qrcodeCanvas img') || document.querySelector('#qrcodeCanvas canvas');
                if (qrImgElement) {
                    await new Promise((resolve) => {
                        if (qrImgElement.tagName === 'IMG') {
                            if (qrImgElement.complete) resolve();
                            else qrImgElement.onload = resolve;
                        } else {
                            resolve();
                        }
                    });
                    ctx.drawImage(qrImgElement, 100, 120, 400, 400);
                }

                ctx.fillStyle = '#e2e8f0';
                ctx.font = '700 22px "Inter", sans-serif';
                const bankText = document.getElementById('cardBankName').innerText + '  •  STK: ' + document.getElementById('cardStk').innerText;
                ctx.fillText(bankText, 300, 580);

                ctx.fillStyle = '#60a5fa';
                ctx.font = '800 28px "Inter", sans-serif';
                ctx.fillText(document.getElementById('cardAmount').innerText, 300, 635);

                ctx.fillStyle = '#facc15';
                ctx.font = '900 26px "Inter", sans-serif';
                ctx.fillText('CK XONG - CHỤP BƯU GỬI', 300, 710);

                canvas.toBlob(async (blob) => {
                    if (!blob) throw new Error("Lỗi tạo ảnh");

                    try {
                        const item = new ClipboardItem({ 'image/png': blob });
                        await navigator.clipboard.write([item]);
                        btnText.innerText = '✅ Đã sao chép ảnh thẻ!';
                        setTimeout(() => { btnText.innerText = 'CHUYỂN TIỀN'; }, 2500);
                    } catch (clipErr) {
                        btnText.innerText = 'CHUYỂN TIỀN';
                        alert('Trình duyệt máy tính chặn sao chép. Vui lòng chuột phải vào ảnh QR để sao chép.');
                    }
                }, 'image/png');

            } catch (err) {
                console.error(err);
                btnText.innerText = 'CHUYỂN TIỀN';
            }
        }

        function renderCards(chats) {
            const grid = document.getElementById('chatGrid');
            const emptyState = document.getElementById('emptyState');

            if (chats.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            const rowTextColors = ['text-emerald-400', 'text-purple-400', 'text-yellow-300'];

            emptyState.classList.add('hidden');
            grid.innerHTML = chats.map((chat, index) => {
                const rowIndex = Math.floor(index / 3);
                const textColorClass = rowTextColors[rowIndex] || 'text-white';

                return `
                    <div class="glass-card rounded-2xl p-4 hover:border-red-500/50 transition-all duration-300 shadow-sm hover:shadow-md group">
                        <div class="flex flex-col mb-3 pb-3 border-b border-slate-800">
                            <div class="w-full text-base font-extrabold tracking-wide uppercase px-3 py-1.5 rounded-xl border border-slate-700 bg-black flex items-center justify-center gap-2 mb-2.5 shadow-sm">
                                <i class="fa-solid fa-user-circle text-lg text-blue-500"></i>
                                <span class="${textColorClass}">${chat.accName}</span>
                            </div>

                            <div class="flex items-center justify-between px-1 text-sm font-bold text-white">
                                <span><i class="fa-solid fa-building-columns mr-1.5 text-blue-500"></i>${chat.title}</span>
                                <span class="font-mono text-white bg-slate-800 px-2.5 py-1 rounded-md border border-slate-700 font-extrabold tracking-wide">
                                    ${chat.stk ? 'STK: ' + chat.stk : ''}
                                </span>
                            </div>
                        </div>

                        <div>
                            <label class="block text-[11px] font-bold text-slate-400 tracking-wider uppercase mb-1.5">
                                Nhập số tiền (VNĐ)
                            </label>

                            <div class="flex gap-2 items-center">
                                <div class="relative flex-1">
                                    <input type="text" id="amount-${chat.id}" oninput="formatCurrencyInput(this)" placeholder="Mặc định số tiền..." class="w-full bg-slate-800 border border-slate-700 text-slate-100 rounded-xl pl-3 pr-7 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-500 font-semibold">
                                    <span class="absolute right-2.5 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400">đ</span>
                                </div>
                                <button onclick="createQR(${chat.id})" class="px-5 py-2.5 rounded-xl bg-red-600 hover:bg-red-700 text-white text-sm font-extrabold shadow-md shadow-red-600/30 transition flex items-center justify-center gap-2 shrink-0">
                                    <i class="fa-solid fa-qrcode text-base"></i>
                                    <span>Tạo QR</span>
                                </button>
                            </div>

                            <div class="flex gap-1.5 mt-2.5 overflow-x-auto">
                                <button onclick="setQuickAmount(${chat.id}, 50000)" class="px-2.5 py-1 rounded-lg bg-black hover:bg-slate-900 text-[11px] font-bold text-yellow-400 border border-yellow-500/50 shadow-sm whitespace-nowrap transition">50k</button>
                                <button onclick="setQuickAmount(${chat.id}, 100000)" class="px-2.5 py-1 rounded-lg bg-black hover:bg-slate-900 text-[11px] font-bold text-yellow-400 border border-yellow-500/50 shadow-sm whitespace-nowrap transition">100k</button>
                                <button onclick="setQuickAmount(${chat.id}, 150000)" class="px-2.5 py-1 rounded-lg bg-black hover:bg-slate-900 text-[11px] font-bold text-yellow-400 border border-yellow-500/50 shadow-sm whitespace-nowrap transition">150k</button>
                                <button onclick="setQuickAmount(${chat.id}, 200000)" class="px-2.5 py-1 rounded-lg bg-black hover:bg-slate-900 text-[11px] font-bold text-yellow-400 border border-yellow-500/50 shadow-sm whitespace-nowrap transition">200k</button>
                                <button onclick="setQuickAmount(${chat.id}, 250000)" class="px-2.5 py-1 rounded-lg bg-black hover:bg-slate-900 text-[11px] font-bold text-yellow-400 border border-yellow-500/50 shadow-sm whitespace-nowrap transition">250k</button>
                                <button onclick="setQuickAmount(${chat.id}, 500000)" class="px-2.5 py-1 rounded-lg bg-black hover:bg-slate-900 text-[11px] font-bold text-yellow-400 border border-yellow-500/50 shadow-sm whitespace-nowrap transition">500k</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleModal(modalId) {
            document.getElementById(modalId).classList.toggle('hidden');
        }

        window.onload = function() {
            renderCards(chatData);
        };
    </script>
</body>
</html>
