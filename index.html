<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Toán QR Code - Kim Chi Mobile</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f3f4f6;
        }
        .bg-gradient-custom {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
        }
        .animate-pulse-slow {
            animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-900 flex items-center justify-center p-3 sm:p-4">

    <!-- Main Container -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-100 my-auto">
        
        <!-- Header -->
        <div class="bg-gradient-custom p-6 text-white text-center relative overflow-hidden">
            <div class="absolute -right-10 -top-10 w-32 h-32 bg-blue-500/20 rounded-full blur-2xl"></div>
            <div class="absolute -left-10 -bottom-10 w-32 h-32 bg-indigo-500/20 rounded-full blur-2xl"></div>
            
            <div class="relative z-10">
                <div class="inline-flex items-center justify-center p-3 bg-white/10 rounded-2xl mb-3 backdrop-blur-md border border-white/10">
                    <i class="fa-solid fa-[#005baa] fa-qrcode text-3xl text-blue-400"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-white">KIM CHI MOBILE</h1>
                <p class="text-xs text-slate-300 mt-1 font-medium">Tạo mã QR chuyển khoản nhanh chóng</p>
            </div>
        </div>

        <!-- Form Body -->
        <div class="p-5 sm:p-6 space-y-5">
            
            <!-- Thông tin tài khoản nhận -->
            <div class="bg-slate-50 rounded-2xl p-4 border border-slate-100 space-y-3">
                <div class="flex items-center justify-between text-xs text-slate-500 font-semibold uppercase tracking-wider">
                    <span>Tài khoản nhận tiền</span>
                    <span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full text-[10px]">MB Bank</span>
                </div>
                
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-xs text-slate-500">Chủ tài khoản</p>
                        <p class="text-sm font-bold text-slate-800 uppercase" id="accountName">ĐẶNG VĂN QUỤNH</p>
                    </div>
                    <div class="text-right">
                        <p class="text-xs text-slate-500">Số tài khoản</p>
                        <div class="flex items-center gap-1.5">
                            <span class="text-sm font-extrabold text-blue-600 tracking-wider" id="accountNo">0375239239</span>
                            <button onclick="copyToClipboard('0375239239', 'Đã chép STK!')" class="text-slate-400 hover:text-blue-600 transition-colors p-1">
                                <i class="fa-regular fa-copy text-xs"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Input Số tiền -->
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                    Số tiền chuyển (VNĐ) <span class="text-red-500">*</span>
                </label>
                <div class="relative">
                    <input type="text" id="amountInput" inputmode="numeric" placeholder="Nhập số tiền (VD: 3200 hoặc 50000)" 
                           class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-lg font-bold text-slate-800 placeholder:text-slate-400 placeholder:font-normal focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
                    <span class="absolute right-4 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400">VNĐ</span>
                </div>
                <p id="amountText" class="text-xs text-blue-600 font-semibold mt-1.5 min-h-[18px]"></p>
                
                <!-- Quick Amount Suggestions -->
                <div class="grid grid-cols-4 gap-1.5 mt-2.5">
                    <button onclick="setAmount(10000)" class="py-1.5 px-2 bg-slate-100 hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200 border border-transparent rounded-lg text-xs font-semibold text-slate-600 transition-all text-center">10k</button>
                    <button onclick="setAmount(20000)" class="py-1.5 px-2 bg-slate-100 hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200 border border-transparent rounded-lg text-xs font-semibold text-slate-600 transition-all text-center">20k</button>
                    <button onclick="setAmount(50000)" class="py-1.5 px-2 bg-slate-100 hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200 border border-transparent rounded-lg text-xs font-semibold text-slate-600 transition-all text-center">50k</button>
                    <button onclick="setAmount(100000)" class="py-1.5 px-2 bg-slate-100 hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200 border border-transparent rounded-lg text-xs font-semibold text-slate-600 transition-all text-center">100k</button>
                    <button onclick="setAmount(200000)" class="py-1.5 px-2 bg-slate-100 hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200 border border-transparent rounded-lg text-xs font-semibold text-slate-600 transition-all text-center">200k</button>
                    <button onclick="setAmount(500000)" class="py-1.5 px-2 bg-slate-100 hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200 border border-transparent rounded-lg text-xs font-semibold text-slate-600 transition-all text-center">500k</button>
                    <button onclick="setAmount(1000000)" class="py-1.5 px-2 bg-slate-100 hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200 border border-transparent rounded-lg text-xs font-semibold text-slate-600 transition-all text-center">1M</button>
                    <button onclick="setAmount(2000000)" class="py-1.5 px-2 bg-slate-100 hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200 border border-transparent rounded-lg text-xs font-semibold text-slate-600 transition-all text-center">2M</button>
                </div>
            </div>

            <!-- Input Nội dung -->
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                    Nội dung chuyển khoản
                </label>
                <input type="text" id="addInfoInput" placeholder="VD: CHUYEN TIEN MUA HANG" 
                       class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 placeholder:text-slate-400 placeholder:font-normal focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
            </div>

            <!-- QR Display Area -->
            <div id="qrContainer" class="hidden pt-2">
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 text-center space-y-3">
                    <p class="text-xs font-bold text-slate-500 uppercase tracking-wider">Quét mã để thanh toán</p>
                    
                    <div class="relative inline-block bg-white p-3 rounded-2xl shadow-sm border border-slate-100">
                        <img id="qrImage" src="" alt="Mã QR VietQR" class="w-56 h-56 mx-auto object-contain rounded-lg">
                    </div>

                    <div class="flex items-center justify-center gap-2 text-xs text-slate-500 font-medium">
                        <i class="fa-solid fa-shield-halved text-emerald-500"></i>
                        <span>Thanh toán an toàn qua VietQR</span>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="space-y-2 pt-1">
                <button onclick="generateQR()" 
                        class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-bold rounded-xl shadow-lg shadow-blue-500/25 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-bolt"></i>
                    <span>TẠO MÃ QR THANH TOÁN</span>
                </button>
            </div>

        </div>

        <!-- Footer -->
        <div class="bg-slate-50 border-t border-slate-100 p-4 text-center">
            <p class="text-[11px] text-slate-400 font-medium">Cửa hàng Kim Chi Mobile • Hỗ trợ mọi ngân hàng</p>
        </div>

    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-4 py-2.5 rounded-xl text-xs font-bold shadow-2xl transition-all duration-300 opacity-0 pointer-events-none translate-y-2 flex items-center gap-2 z-50">
        <i class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
        <span id="toastMsg">Đã sao chép!</span>
    </div>

    <!-- JavaScript Handling -->
    <script>
        const BANK_ID = "MB";
        const ACCOUNT_NO = "0375239239";
        const ACCOUNT_NAME = "DANG VAN QUYNH";

        const amountInput = document.getElementById('amountInput');
        const amountText = document.getElementById('amountText');
        const addInfoInput = document.getElementById('addInfoInput');
        const qrContainer = document.getElementById('qrContainer');
        const qrImage = document.getElementById('qrImage');

        // Hàm đọc số tiền chuẩn xác
        function getRawAmount() {
            let val = amountInput.value.replace(/[^0-9]/g, '');
            if (!val) return 0;
            let num = parseInt(val, 10);
            
            // Nếu người dùng gõ số < 10000 (VD: 3200), tự động hiểu là 3.200.000 (nhân 1000)
            if (num > 0 && num < 10000) {
                num = num * 1000;
            }
            return num;
        }

        // Định dạng hiển thị khi gõ
        amountInput.addEventListener('input', function(e) {
            let val = this.value.replace(/[^0-9]/g, '');
            if (val) {
                let num = parseInt(val, 10);
                let actualNum = num;
                if (num > 0 && num < 10000) {
                    actualNum = num * 1000;
                }
                amountText.innerText = `Số tiền thực tế: ${actualNum.toLocaleString('vi-VN')} VNĐ`;
            } else {
                amountText.innerText = '';
            }
        });

        // Đặt số tiền từ nút gợi ý (Giữ nguyên không bị nhân đôi/nhân nghìn)
        function setAmount(val) {
            amountInput.value = val.toLocaleString('vi-VN');
            amountText.innerText = `Số tiền thực tế: ${val.toLocaleString('vi-VN')} VNĐ`;
        }

        // Tạo mã QR VietQR
        function generateQR() {
            const finalAmount = getRawAmount();
            const addInfo = addInfoInput.value.trim();

            if (!finalAmount || finalAmount <= 0) {
                showToast("Vui lòng nhập số tiền hợp lệ!");
                amountInput.focus();
                return;
            }

            // Cập nhật lại ô input hiển thị chính xác số tiền đầy đủ
            amountInput.value = finalAmount.toLocaleString('vi-VN');

            // Tạo URL VietQR theo chuẩn VietQR.io API
            let qrUrl = `https://img.vietqr.io/image/${BANK_ID}-${ACCOUNT_NO}-compact2.png?amount=${finalAmount}&accountName=${encodeURIComponent(ACCOUNT_NAME)}`;
            
            if (addInfo) {
                qrUrl += `&addInfo=${encodeURIComponent(addInfo)}`;
            }

            qrImage.src = qrUrl;
            qrContainer.classList.remove('hidden');

            // Cuộn mượt tới mã QR
            setTimeout(() => {
                qrContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }

        // Sao chép văn bản
        function copyToClipboard(text, msg) {
            navigator.clipboard.writeText(text).then(() => {
                showToast(msg || "Đã sao chép vào bộ nhớ tạm!");
            }).catch(() => {
                showToast("Sao chép thất bại!");
            });
        }

        // Hiển thị Toast thông báo
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.innerText = message;
            
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-2');
            }, 2500);
        }
    </script>
</body>
</html>
